services:
  vps-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vps-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SESSION_SECRET: "change-me-in-production"
    volumes:
      - ./data.json:/app/data.json
